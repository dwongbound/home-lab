# XcodeGen spec for the Jarvis app. The .xcodeproj is generated, not
# committed: run `xcodegen` in ios/ (brew install xcodegen), then open
# Jarvis.xcodeproj. See ios/README.md.
name: Jarvis
options:
  bundleIdPrefix: com.dwongbound
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
    tvOS: "18.0"
  createIntermediateGroups: true

packages:
  JarvisKit:
    path: .

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    # CI sets this to the run number so every TestFlight upload is newer.
    CURRENT_PROJECT_VERSION: "36"
    # Your team id goes here (or in Xcode's Signing tab) to sign for a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  # Scripted swipes for the Home-to-Talk freeze (2026-11-19); simulator only.
  JarvisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Jarvis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwongbound.jarvis.uitests
        TEST_TARGET_NAME: Jarvis
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
  Jarvis:
    type: application
    platform: iOS
    # Its scheme runs the swipe-freeze UI test too.
    scheme:
      testTargets:
        - JarvisUITests
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: JarvisKit
      # Talk's Live Activity (Dynamic Island), drawn by this extension.
      - target: JarvisLiveActivity
      # The Watch app ships inside the iPhone app (it asks Jarvis through
      # the phone, since Tailscale doesn't run on the Watch).
      - target: JarvisWatch
    # Push notifications (paid membership, Dylan 2026-11-18): Jarvis's
    # messages, approvals and alerts reach the lock screen.
    entitlements:
      path: App/Jarvis.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwongbound.jarvis
        PRODUCT_NAME: Jarvis
        # iPhone and iPad.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        NSFaceIDUsageDescription: Face ID unlocks your money details on the Today tab.
        NSCameraUsageDescription: Take a photo, like your food, to send to Jarvis in the chat.
        # Talk shows in the Dynamic Island while the app is in the background.
        NSSupportsLiveActivities: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Landscape is only used by the iPhone's bedside kiosk; the tabs stay
        # portrait (OrientationLock in App/PhoneKiosk.swift).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        # Talk: the microphone, and background audio so a call keeps going
        # with the screen locked.
        NSMicrophoneUsageDescription: Jarvis listens while you talk to him on the Talk tab.
        UIBackgroundModes:
          - audio
        # No encryption beyond HTTPS: skips the export-compliance question
        # on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false

  # The Dynamic Island / Lock Screen view of a Talk call.
  JarvisLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwongbound.jarvis.LiveActivity
        PRODUCT_NAME: JarvisLiveActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.9"
    info:
      path: LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Apple Watch: ask by voice, see the answer, approve or deny. Talks to
  # Jarvis through the iPhone app (App/WatchBridge.swift).
  JarvisWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: App/OrbView.swift
      - path: App/Theme.swift
      - path: WatchWidgets/ComplicationViews.swift
    dependencies:
      - package: JarvisKit
      # The complications, embedded in the Watch app.
      - target: JarvisWatchComplications
    # Shares the complication data with the complications.
    entitlements:
      path: Watch/JarvisWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dwongbound.jarvis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwongbound.jarvis.watchkitapp
        PRODUCT_NAME: Jarvis
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.dwongbound.jarvis

  # Apple Watch complications: Ask Jarvis, Needs you, Next up.
  JarvisWatchComplications:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchWidgets
    dependencies:
      - package: JarvisKit
    entitlements:
      path: WatchWidgets/JarvisWatchComplications.entitlements
      properties:
        com.apple.security.application-groups: [group.com.dwongbound.jarvis]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwongbound.jarvis.watchkitapp.complications
        PRODUCT_NAME: JarvisWatchComplications
        SWIFT_VERSION: "5.9"
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Apple TV: the always-on display. Reaches the PC over Tailscale's
  # Apple TV app.
  JarvisTV:
    type: application
    platform: tvOS
    sources:
      - path: TV
      - path: App/OrbView.swift
      - path: App/Theme.swift
    dependencies:
      - package: JarvisKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwongbound.jarvis.tv
        PRODUCT_NAME: Jarvis
        # The layered home-screen icon and Top Shelf art (scripts/make_tv_icon.py).
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        SWIFT_VERSION: "5.9"
    info:
      path: TV/Info.plist
      properties:
        CFBundleDisplayName: Jarvis
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        # jarvis://  opens the app to its usual always-on screen (a playbook
        # can launch it by this as well as by bundle id).
        CFBundleURLTypes:
          - CFBundleURLName: com.dwongbound.jarvis.tv
            CFBundleURLSchemes: [jarvis]

