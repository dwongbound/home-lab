# The page on jarvis, in Docker: `docker compose up -d --build`.
#
# Host networking, so 127.0.0.1 inside the container is the PC itself and
# Ollama, Jarvis (127.0.0.1:8765) and Home Assistant answer at the same
# addresses as outside it. It listens on 127.0.0.1:4180 only; `tailscale
# serve` on Windows is what puts it on your phone and Mac (README,
# "Reaching it"). Publish it on a different port than 4180: WSL's
# mirrored networking shares ports between Ubuntu and Windows. Never set HOST=0.0.0.0 here: the page passes on the
# Tailscale login header to Jarvis, so it must only hear from Tailscale.
services:
  home-lab:
    build: .
    container_name: home-lab
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      DATA_SOURCE: live
      HOST: 127.0.0.1
      PORT: "4180"
      # nvidia-smi finds the driver's libnvidia-ml.so here, as it does in WSL.
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      # The calendar, email and money digest that Jarvis's home_lab_digest job
      # writes every 15 minutes (mounted below).
      DIGEST_FILE: /digest/digest.json
      # Claude project threads, written into the same folder hourly by
      # Claude in the project (Jarvis can't see claude.ai).
      THREADS_FILE: /digest/threads.json
    volumes:
      # Free space on C:, read-only.
      - /mnt/c:/mnt/c:ro
      # WSL's nvidia-smi and the driver libraries it needs, read-only.
      - /usr/lib/wsl:/usr/lib/wsl:ro
      # Jarvis's digest, read-only. The folder, not the file: Jarvis replaces
      # the file by renaming a new one over it, which a file mount wouldn't see.
      - ${HOME}/.local/share/home-lab-digest/out:/digest:ro
    devices:
      # The GPU as WSL exposes it, so nvidia-smi can read memory use.
      - /dev/dxg
